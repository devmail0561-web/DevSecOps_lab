# ============================================================
# Remédiation V1 (CWE-16) + V9 (CWE-307)
# Configuration Nginx — Reverse proxy sécurisé pour Juice Shop
#
# Problèmes corrigés :
#   V1 — Missing Security Headers (HSTS, CSP, Referrer-Policy)
#        OWASP A05:2021 — Security Misconfiguration
#   V9 — Absence de rate limiting sur /rest/user/login
#        OWASP A07:2021 — Identification and Authentication Failures
#
# Architecture :
#   [Client] → [Nginx:443] → [juiceshop:3000]
#
# Prérequis :
#   - Certificat TLS (Let's Encrypt ou auto-signé pour les tests)
#   - Module ngx_http_limit_req_module (inclus dans nginx standard)
# ============================================================

# ── Zones de rate limiting ─────────────────────────────────
# Limite les tentatives de connexion par IP pour contrer le
# brute-force (V9 — CWE-307, OWASP A07:2021)

# Zone login : 5 requêtes/minute par IP (burst 3 sans délai)
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=5r/m;

# Zone API générale : 30 requêtes/minute par IP
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/m;

# ── Redirection HTTP → HTTPS ───────────────────────────────
server {
    listen      80;
    server_name _;

    # Forcer HTTPS — empêche toute communication en clair
    return 301 https://$host$request_uri;
}

# ── Serveur HTTPS principal ────────────────────────────────
server {
    listen      443 ssl http2;
    server_name localhost;

    # ── Certificats TLS ─────────────────────────────────────
    # Remplacer par les chemins réels en production
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # ── Configuration TLS sécurisée ─────────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout       1d;
    ssl_session_cache         shared:SSL:10m;
    ssl_stapling              on;
    ssl_stapling_verify       on;

    # ── Suppression des en-têtes révélateurs ────────────────
    # Empêche la divulgation de la technologie utilisée
    proxy_hide_header X-Powered-By;
    more_clear_headers Server;     # nécessite ngx_headers_more

    # ── En-têtes de sécurité HTTP ───────────────────────────
    # Tous définis avec `always` pour s'appliquer même sur les
    # réponses d'erreur (4xx, 5xx)

    # HSTS — Force HTTPS pour 1 an sur ce domaine et ses sous-domaines
    # Corrige V1 : Strict-Transport-Security manquant (CWE-16)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # CSP — Restreint les sources autorisées pour les ressources
    # Première ligne de défense contre le XSS (CWE-79)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-src 'none'; worker-src 'self' blob:; manifest-src 'self'; base-uri 'self'; form-action 'self';" always;

    # Referrer-Policy — Limite les fuites d'URL dans les requêtes cross-origin
    # Corrige V1 : Referrer-Policy manquant (CWE-16)
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # X-Content-Type-Options — Empêche le MIME-sniffing
    # Évite l'interprétation malveillante de fichiers uploadés
    add_header X-Content-Type-Options "nosniff" always;

    # X-Frame-Options — Protège contre le clickjacking
    # Corrige la configuration par défaut SAMEORIGIN de Juice Shop
    add_header X-Frame-Options "DENY" always;

    # Permissions-Policy — Désactive les APIs sensibles inutilisées
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=()" always;

    # ── Location : endpoint de login (rate limiting strict) ──
    # Corrige V9 — Absence de rate limiting (CWE-307, OWASP A07:2021)
    # Préuve : test_auth.sh confirmait 5 tentatives sans HTTP 429
    location /rest/user/login {
        # 5 requêtes/minute, burst de 3 requêtes autorisé sans délai
        # Au-delà → HTTP 429 Too Many Requests
        limit_req zone=login_zone burst=3 nodelay;
        limit_req_status 429;

        proxy_pass         http://juiceshop:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Location : API générale (rate limiting modéré) ───────
    location /api/ {
        limit_req zone=api_zone burst=10 nodelay;
        limit_req_status 429;

        proxy_pass         http://juiceshop:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Location : REST API (rate limiting modéré) ───────────
    location /rest/ {
        limit_req zone=api_zone burst=10 nodelay;
        limit_req_status 429;

        proxy_pass         http://juiceshop:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Location : toutes les autres requêtes ────────────────
    location / {
        proxy_pass         http://juiceshop:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ── Logs ────────────────────────────────────────────────
    access_log /var/log/nginx/juiceshop_access.log;
    error_log  /var/log/nginx/juiceshop_error.log warn;
}

# ── Vérification des corrections ───────────────────────────
#
# V1 (headers) :
#   curl -I https://localhost | grep -E 'Strict-Transport|Content-Security|Referrer-Policy'
#   → Les 3 en-têtes doivent être présents
#
# V9 (rate limiting) :
#   for i in $(seq 1 10); do
#     curl -s -o /dev/null -w "Tentative $i: HTTP %{http_code}\n" \
#       -X POST -H "Content-Type: application/json" \
#       -d '{"email":"test@test.com","password":"wrong"}' \
#       https://localhost/rest/user/login
#   done
#   → HTTP 429 attendu dès la 4ème tentative
